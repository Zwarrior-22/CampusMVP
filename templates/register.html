{% extends "base.html" %}

{% block title %}Register - Campus Connect{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Register</h2>
        <p>Create an account to post announcements</p>
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required class="form-input">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required class="form-input">
            </div>

            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required class="form-input">
            </div>

            <div class="form-group">
                <label for="organization">Organization/Club Name</label>
                <input type="text" id="organization" name="organization" required class="form-input" placeholder="e.g., Drama Club, Student Council">
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" name="role" required class="form-input">
                    <option value="club">Club Organizer</option>
                    <option value="admin">Faculty/Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
